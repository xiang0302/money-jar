<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>钱罐记账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c2436;
    --navy-2:#252f47;
    --cream:#f2ede2;
    --card:#faf7f0;
    --gold:#c3944a;
    --gold-2:#b0813a;
    --green:#3a6b53;
    --green-light:#e7efe9;
    --red:#c05a3e;
    --red-light:#f6e6e0;
    --ink:#20241f;
    --ink-soft:#6b6a63;
    --line:#e7e0d1;
    --shadow:0 2px 10px rgba(28,36,54,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--cream);
    font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .num{font-family:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
  .app{
    max-width:520px;margin:0 auto;min-height:100vh;background:var(--cream);
    padding-bottom:calc(100px + constant(safe-area-inset-bottom));
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
  }

  /* HERO */
  .hero{
    background:linear-gradient(160deg,var(--navy),var(--navy-2) 80%);
    color:#fff;
    padding:24px 20px 24px;
    border-radius:0 0 28px 28px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    background:radial-gradient(circle,rgba(195,148,74,0.25),transparent 70%);
  }
  .hero-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .top-left-title {
    font-size: 13px;
    letter-spacing: 0.1em;
    opacity: 0.85;
    font-weight: 700;
  }
  .top-right-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn-text-ghost {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn-text-ghost:active {
    background: rgba(255,255,255,0.25);
  }
  .currency-selector {
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    padding: 4px 6px;
    font-size: 11.5px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
  }
  .currency-selector option {
    background: var(--navy);
    color: #fff;
  }
  .hero h1{font-size:20px;margin:0 0 12px;font-weight:700;}
  .total-label{font-size:12.5px;opacity:0.65;margin-bottom:4px;}
  .total-value{font-size:34px;font-weight:500;letter-spacing:-0.5px;}
  .total-note{font-size:11px;opacity:0.55;margin-top:6px;line-height:1.5;}
  .hero-actions{display:flex;gap:8px;margin-top:16px;}
  .btn{
    flex:1;border:none;border-radius:14px;padding:12px 8px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .12s ease, opacity .12s ease;
    text-align: center;
  }
  .btn:active{transform:scale(0.96);}
  .btn-gold{background:linear-gradient(180deg,#d3a35a,var(--gold-2));color:#2a1c08;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.18);}

  /* SECTIONS */
  .section{padding:20px 18px 4px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .section-title{font-size:18px;font-weight:700;}
  .section-link{font-size:12.5px;color:var(--green);background:none;border:none;font-weight:700;cursor:pointer;font-family:inherit;}
  
  /* FILTER BAR */
  .filter-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .filter-select {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
    font-family: inherit;
    color: var(--ink);
    font-weight: 500;
    outline: none;
    cursor: pointer;
  }
  .filter-select:focus {
    border-color: var(--gold);
  }

  .search-bar-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .search-input {
    flex: 1;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .search-input:focus {
    border-color: var(--gold);
  }

  .empty{
    text-align:center;padding:32px 18px;color:var(--ink-soft);font-size:13px;
    background:var(--card);border:1.5px dashed var(--line);border-radius:18px;line-height:1.7;
  }

  /* JAR CARD */
  .jar-card{
    background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;
    box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03);
  }
  .jar-top{display:flex;align-items:center;gap:14px;}
  .bottle{width:52px;height:66px;flex-shrink:0;position:relative;}
  .bottle svg{width:100%;height:100%;display:block;}
  .jar-info{flex:1;min-width:0;}
  .jar-name{font-size:15px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:6px;}
  .jar-value{font-size:22px;font-weight:500;letter-spacing:-0.3px;}
  .jar-value.neg{color:var(--red);}
  .jar-plan{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .jar-menu-btn{
    width:30px;height:30px;border-radius:9px;border:none;background:transparent;color:var(--ink-soft);
    font-size:18px;cursor:pointer;flex-shrink:0;
  }
  .jar-menu-btn:active{background:rgba(0,0,0,0.06);}
  .progress-track{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;border-radius:5px;transition:width .3s ease;}
  .tag-over{
    display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--red);
    background:var(--red-light);padding:3px 10px;border-radius:20px;
  }
  .jar-actions{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap;}
  .mini-btn{
    flex:1;min-width:60px;font-size:12px;font-weight:700;padding:7px 4px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;text-align:center;
  }
  .mini-btn.record{color:var(--green);border-color:#cfe2d7;}
  .mini-btn.del{color:var(--red);border-color:#eccec4;}

  /* RECORDS */
  .record-row{
    display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;
    padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);
  }
  .rec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .rec-mid{flex:1;min-width:0;}
  .rec-jar{font-size:14px;font-weight:700;}
  .rec-note{font-size:11.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rec-date{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .rec-amt{font-size:15px;font-weight:700;}
  .rec-amt.in{color:var(--green);}
  .rec-amt.out{color:var(--red);}
  .rec-actions{display:flex;gap:4px;align-items:center;}
  .rec-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;padding:4px;}

  /* FAB */
  .fab-bar{
    position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:linear-gradient(180deg,rgba(242,237,226,0),var(--cream) 30%);
    padding:16px 18px calc(20px + constant(safe-area-inset-bottom));
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex;gap:10px;z-index:10;
  }

  /* MODAL */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,30,0.55);display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--cream);width:100%;max-width:520px;border-radius:24px 24px 0 0;
    padding:20px 20px 28px;max-height:88vh;overflow-y:auto;animation:slideup .22s ease;position:relative;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-title{font-size:18px;font-weight:700;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);
    font-family:inherit;font-size:15px;background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
  .seg{display:flex;gap:8px;}
  .seg button{
    flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
    font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .seg button.active{border-color:var(--gold);color:var(--gold-2);background:#fbf3e6;}
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .emoji-grid button{
    font-size:20px;padding:8px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;
  }
  .emoji-grid button.active{border-color:var(--gold);background:#fbf3e6;}
  .color-row{display:flex;gap:9px;flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;}
  .swatch.active{border-color:var(--navy);}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .sheet-actions .btn{padding:14px;}
  .btn-cancel{background:#fff;color:var(--ink-soft);border:1.5px solid var(--line);}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:-6px;margin-bottom:14px;line-height:1.5;}
  .close-x{position:absolute;right:18px;top:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}

  /* SPEND ANALYSIS */
  .spend-stats{display:flex;gap:10px;margin-bottom:12px;}
  .stat-card{
    flex:1;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);
  }
  .stat-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;}
  .stat-value{font-size:18px;font-weight:700;}
  .stat-value.red{color:var(--red);}
  .stat-value.green{color:var(--green);}
  .breakdown-row{margin-bottom:12px;}
  .breakdown-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .breakdown-name{font-weight:700;}
  .breakdown-amt{color:var(--ink-soft);font-family:'DM Mono',monospace;}
  .breakdown-track{height:9px;border-radius:6px;background:var(--line);overflow:hidden;}
  .breakdown-fill{height:100%;border-radius:6px;}
  .footer-tip{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:20px;opacity:0.8;}

  /* 打印 PDF 专属样式控制 */
  @media print {
    body { background: #fff !important; color: #000 !important; }
    .app { max-width: 100% !important; padding: 0 !important; }
    .hero-actions, .fab-bar, .overlay, .mini-btn, .rec-actions, .close-x, .currency-selector, .filter-controls, .btn-text-ghost, .section-link, .search-bar-wrap {
      display: none !important;
    }
    .hero { background: #fff !important; color: #000 !important; border-radius: 0 !important; padding: 10px 0 !important; border-bottom: 2px solid #000; }
    .hero h1, .hero .total-value { color: #000 !important; }
    .jar-card, .stat-card, .record-row, #dailyChartCard { box-shadow: none !important; border: 1px solid #ddd !important; background: #fff !important; page-break-inside: avoid; break-inside: avoid; }
    .footer-tip { display: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="hero">
    <div class="hero-top-bar">
      <div class="top-left-title">钱罐记账</div>
      <div class="top-right-actions">
        <button class="btn-text-ghost" onclick="openRatesModal()">汇率设置</button>
        <button class="btn-text-ghost" onclick="exportBackup()">备份</button>
        <label class="btn-text-ghost" style="cursor:pointer;">导入<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)"></label>
        <select id="globalCurrencySelect" class="currency-selector" onchange="changeGlobalCurrency(this.value)" aria-label="选择全局货币">
          <option value="MYR">🇲🇾 MYR (RM)</option>
          <option value="CNY">🇨🇳 CNY (¥)</option>
          <option value="USD">🇺🇸 USD ($)</option>
          <option value="SGD">🇸🇬 SGD (S$)</option>
          <option value="EUR">🇪🇺 EUR (€)</option>
          <option value="HKD">🇭🇰 HKD (HK$)</option>
          <option value="JPY">🇯🇵 JPY (¥)</option>
        </select>
      </div>
    </div>
    <h1>各分类实际资金总览</h1>
    <div class="total-label">资产总计（已自动折算）</div>
    <div class="total-value num" id="totalValue">RM 0.00</div>
    <div class="total-note">只算真正留在你手上的钱 · 数据仅存于本地浏览器</div>
    <div class="hero-actions">
      <button class="btn btn-gold" onclick="openRecordModal()">＋ 记一笔</button>
      <button class="btn btn-ghost" onclick="openTransferModal()">⇆ 划转</button>
      <button class="btn btn-ghost" onclick="applyAutoPlans()">自动分配</button>
    </div>
  </div>

  <!-- 支出分析与历史数据查看 -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">支出分析</div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="section-link" onclick="printReport('analysis')">📄 导出报告</button>
        <div class="filter-controls">
          <select id="yearSelect" class="filter-select" onchange="onDateFilterChange()" aria-label="选择年份"></select>
          <select id="monthSelect" class="filter-select" onchange="onDateFilterChange()" aria-label="选择月份"></select>
        </div>
      </div>
    </div>
    <div id="spendSummary"></div>
    <div id="spendBreakdown"></div>
    <div class="jar-card" id="dailyChartCard" style="display:none;">
      <div id="chartTitle" style="font-size:13px;font-weight:700;margin-bottom:10px;">每日支出趋势</div>
      <canvas id="dailyChart" height="110" style="width:100%;display:block;"></canvas>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">资产类罐子</div>
      <button class="section-link" onclick="openJarModal(null,'asset')">＋ 新增项目</button>
    </div>
    <div id="assetList"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title" id="budgetSectionTitle">月度支出预算</div>
      <button class="section-link" onclick="openJarModal(null,'budget')">＋ 新增预算</button>
    </div>
    <div id="budgetList"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">最近记录</div>
      <button class="section-link" onclick="printReport('records')">📄 导出明细(PDF)</button>
    </div>
    <div class="search-bar-wrap">
      <input type="text" id="recSearchInput" class="search-input" placeholder="搜索备注/罐子..." oninput="renderRecords()">
      <select id="recJarFilter" class="filter-select" onchange="renderRecords()" aria-label="筛选罐子">
        <option value="all">全部罐子</option>
      </select>
    </div>
    <div id="recordList"></div>
    <div class="footer-tip">💡 数据保存在本地设备，历史数据永久留存，可点击右上角「数据备份」安全导出</div>
  </div>

  <div class="fab-bar">
    <button class="btn btn-gold" onclick="openRecordModal()" style="box-shadow:0 6px 18px rgba(176,129,58,0.35);">＋ 记一笔</button>
  </div>
</div>

<!-- Jar Modal -->
<div class="overlay" id="jarOverlay">
  <div class="sheet">
    <button class="close-x" onclick="closeModal('jarOverlay')">✕</button>
    <div class="sheet-title" id="jarModalTitle">新增项目</div>

    <div class="field">
      <label>类型</label>
      <div class="seg">
        <button type="button" id="typeAssetBtn" onclick="setJarType('asset')">资产类（存钱）</button>
        <button type="button" id="typeBudgetBtn" onclick="setJarType('budget')">支出预算（花钱）</button>
      </div>
    </div>

    <div class="field">
      <label for="jarCurrency">项目货币</label>
      <select id="jarCurrency">
        <option value="MYR">🇲🇾 MYR - 马来西亚林吉特 (RM)</option>
        <option value="CNY">🇨🇳 CNY - 人民币 (¥)</option>
        <option value="USD">🇺🇸 USD - 美元 ($)</option>
        <option value="SGD">🇸🇬 SGD - 新加坡元 (S$)</option>
        <option value="EUR">🇪🇺 EUR - 欧元 (€)</option>
        <option value="HKD">🇭🇰 HKD - 港币 (HK$)</option>
        <option value="JPY">🇯🇵 JPY - 日元 (¥)</option>
      </select>
    </div>

    <div class="field">
      <label for="jarName">名称</label>
      <input type="text" id="jarName" placeholder="例如：Touch 'n Go / 餐饮预算">
    </div>

    <div class="field">
      <label>图标</label>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="field">
      <label>颜色</label>
      <div class="color-row" id="colorRow"></div>
    </div>

    <div class="field" id="initialField">
      <label for="jarInitial">初始余额</label>
      <input type="number" id="jarInitial" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="field">
      <label id="planLabel" for="jarPlan">每月计划存入</label>
      <input type="number" id="jarPlan" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="field" id="freqField">
      <label for="jarFreq">自动重复</label>
      <select id="jarFreq">
        <option value="none">不自动，仅手动记录</option>
        <option value="monthly">每月自动存入一次</option>
        <option value="weekly">每周自动存入一次</option>
        <option value="yearly">每年自动存入一次</option>
      </select>
      <div class="hint">到期后点击首页「自动分配」即会按计划金额自动入账</div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-cancel" onclick="closeModal('jarOverlay')">取消</button>
      <button class="btn btn-gold" onclick="saveJar()">保存</button>
    </div>
  </div>
</div>

<!-- Record Modal -->
<div class="overlay" id="recordOverlay">
  <div class="sheet">
    <button class="close-x" onclick="closeModal('recordOverlay')">✕</button>
    <div class="sheet-title" id="recordModalTitle">记一笔</div>

    <div class="field">
      <label for="recJar">选择罐子</label>
      <select id="recJar" onchange="onRecordJarChange()"></select>
    </div>

    <div class="field">
      <label>方向</label>
      <div class="seg">
        <button type="button" id="dirInBtn" onclick="setDirection('in')">存入 / 收入</button>
        <button type="button" id="dirOutBtn" onclick="setDirection('out')">支出 / 取出</button>
      </div>
    </div>

    <div class="field">
      <label for="recAmount">金额</label>
      <input type="number" id="recAmount" placeholder="0.00" step="0.01" min="0.01">
    </div>

    <div class="field">
      <label for="recDate">日期</label>
      <input type="date" id="recDate">
    </div>

    <div class="field">
      <label for="recNote">备注（可选）</label>
      <input type="text" id="recNote" placeholder="例如：GrabFood 晚餐 / 补贴家用">
    </div>

    <div class="sheet-actions">
      <button class="btn btn-cancel" onclick="closeModal('recordOverlay')">取消</button>
      <button class="btn btn-gold" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<!-- Transfer Modal -->
<div class="overlay" id="transferOverlay">
  <div class="sheet">
    <button class="close-x" onclick="closeModal('transferOverlay')">✕</button>
    <div class="sheet-title">资金划转</div>

    <div class="field">
      <label for="transFromJar">转出罐子</label>
      <select id="transFromJar"></select>
    </div>

    <div class="field">
      <label for="transToJar">转入罐子</label>
      <select id="transToJar"></select>
    </div>

    <div class="field">
      <label for="transAmount">转出金额</label>

<script>
/* ---------------- DATE UTILS (FIXING TIMEZONE BUGS) ---------------- */
function parseLocalDate(dateStr) {
  if (!dateStr) return new Date();
  const parts = dateStr.split('-');
  if (parts.length < 3) return new Date();
  return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
}

function todayStr(){ 
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function checkPeriodMatch(dateStr, year, month){
  if(!dateStr) return false;
  const parts = dateStr.split('-');
  if(parts.length < 2) return false;
  const rYear = parseInt(parts[0], 10);
  const rMonth = parseInt(parts[1], 10);
  if (rYear !== year) return false;
  if (month !== 0 && rMonth !== month) return false;
  return true;
}

/* ---------------- CURRENCY & RATES ---------------- */
const CURRENCIES = {
  MYR: { symbol: 'RM ', name: '马来西亚林吉特' },
  CNY: { symbol: '¥ ',  name: '人民币' },
  USD: { symbol: '$ ',  name: '美元' },
  SGD: { symbol: 'S$ ', name: '新加坡元' },
  EUR: { symbol: '€ ',  name: '欧元' },
  HKD: { symbol: 'HK$ ', name: '港币' },
  JPY: { symbol: '¥ ',  name: '日元' }
};

const DEFAULT_RATES = {
  MYR: 1.0, CNY: 0.65, USD: 4.40, SGD: 3.30, EUR: 4.70, HKD: 0.56, JPY: 0.029
};

const RATES_KEY = 'moneyjar_rates_v1';
function loadRates(){
  try {
    const custom = JSON.parse(localStorage.getItem(RATES_KEY));
    return Object.assign({}, DEFAULT_RATES, custom);
  } catch(e) {
    return DEFAULT_RATES;
  }
}

let RATES_TO_MYR = loadRates();
let globalCurrency = localStorage.getItem('moneyjar_global_currency') || 'MYR';

// Bug 修复 5: 增加在线实时汇率获取（以 MYR 为基准自动反算）
async function fetchLiveRates() {
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/MYR');
    const data = await res.json();
    if (data && data.rates) {
      Object.keys(CURRENCIES).forEach(code => {
        if (code !== 'MYR' && data.rates[code]) {
          RATES_TO_MYR[code] = parseFloat((1 / data.rates[code]).toFixed(4));
        }
      });
      localStorage.setItem(RATES_KEY, JSON.stringify(RATES_TO_MYR));
      render();
      console.log('实时汇率已成功同步');
    }
  } catch (err) {
    console.warn('网络汇率获取失败，已兜底使用本地缓存汇率', err);
  }
}

function fmt(n, currencyCode = globalCurrency){
  const curr = CURRENCIES[currencyCode] || CURRENCIES.MYR;
  const sign = n < 0 ? '-' : '';
  const decimals = currencyCode === 'JPY' ? 0 : 2;
  return sign + curr.symbol + Math.abs(n).toLocaleString('en-US',{
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function convertAmount(amount, fromCurr, toCurr){
  if(fromCurr === toCurr) return amount;
  const rateFrom = RATES_TO_MYR[fromCurr] || 1.0;
  const rateTo = RATES_TO_MYR[toCurr] || 1.0;
  return (amount * rateFrom) / rateTo;
}

function changeGlobalCurrency(code){
  globalCurrency = code;
  localStorage.setItem('moneyjar_global_currency', code);
  render();
}

function openRatesModal(){
  const wrap = document.getElementById('ratesInputs');
  wrap.innerHTML = Object.keys(CURRENCIES).map(code=>{
    if(code === 'MYR') return '';
    return `<div class="field">
      <label for="rate_${code}">1 ${code} = ? MYR (RM)</label>
      <input type="number" id="rate_${code}" value="${RATES_TO_MYR[code]||1}" step="0.001" min="0.0001">
    </div>`;
  }).join('');
  document.getElementById('ratesOverlay').classList.add('show');
}

function saveCustomRates(){
  Object.keys(CURRENCIES).forEach(code=>{
    if(code !== 'MYR'){
      const el = document.getElementById(`rate_${code}`);
      if(el && !isNaN(parseFloat(el.value))){
        RATES_TO_MYR[code] = parseFloat(el.value);
      }
    }
  });
  localStorage.setItem(RATES_KEY, JSON.stringify(RATES_TO_MYR));
  closeModal('ratesOverlay');
  render();
}

/* ---------------- DATA LAYER ---------------- */
const STORE_KEY = 'moneyjar_jars_v1';
const REC_KEY = 'moneyjar_records_v1';

function loadJars(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; } }
function saveJars(v){ try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch(e){ alert("本地存储受限"); } }
function loadRecords(){ try{ return JSON.parse(localStorage.getItem(REC_KEY)) || []; }catch(e){ return []; } }
function saveRecords(v){ try { localStorage.setItem(REC_KEY, JSON.stringify(v)); } catch(e){ alert("本地存储受限"); } }

let jars = loadJars();
let records = loadRecords();

const EMOJIS = ['💰','🏦','📈','🎯','🐷','🏠','🚗','✈️','🎓','💊','🛒','🎁','📱','🍔','🎉','⚡','🌟','💡','🧾','🍎','☕','🩺'];
const COLORS = ['#3a6b53','#2f5f8a','#c3944a','#c05a3e','#7a5ea8','#3a7f7a','#8a6d3a','#5a5a8a'];

let jarModalType = 'asset';
let jarModalEditId = null;
let jarModalIcon = EMOJIS[0];
let jarModalColor = COLORS[0];
let recDirection = 'in';
let editingRecordId = null;

let selectedYear = new Date().getFullYear();
let selectedMonth = new Date().getMonth() + 1;

/* ---------------- COMPUTATION ---------------- */
function jarRecords(jarId){ return records.filter(r=>r.jarId===jarId); }

function assetBalance(jar){
  const recs = jarRecords(jar.id);
  const net = recs.reduce((s,r)=> s + (r.direction==='in'? parseFloat(r.amount) : -parseFloat(r.amount)), 0);
  return (jar.initial||0) + net;
}

function assetInvestmentStats(jar){
  const recs = jarRecords(jar.id);
  const principalNet = recs.filter(r=>!r.revalue).reduce((s,r)=> s + (r.direction==='in'? parseFloat(r.amount) : -parseFloat(r.amount)), 0);
  const principal = (jar.initial||0) + principalNet;
  const gain = recs.filter(r=>r.revalue).reduce((s,r)=> s + (r.direction==='in'? parseFloat(r.amount) : -parseFloat(r.amount)), 0);
  const gainPct = principal !== 0 ? (gain/principal*100) : 0;
  const hasRevalue = recs.some(r=>r.revalue);
  return { principal, gain, gainPct, hasRevalue };
}

function assetMonthProgress(jar){
  const recs = jarRecords(jar.id).filter(r=>r.direction==='in' && checkPeriodMatch(r.date, selectedYear, selectedMonth) && !r.revalue);
  const sum = recs.reduce((s,r)=>s+parseFloat(r.amount),0);
  if(!jar.plan) return 0;
  const multiplier = selectedMonth === 0 ? 12 : 1;
  return Math.max(0, Math.min(100, (sum / (jar.plan * multiplier)) * 100));
}

function budgetSpent(jar, year = selectedYear, month = selectedMonth){
  const recs = jarRecords(jar.id).filter(r=>checkPeriodMatch(r.date, year, month));
  return recs.reduce((s,r)=> s + (r.direction==='out'? parseFloat(r.amount) : -parseFloat(r.amount)), 0);
}

function filterOutRecords(year, month){
  return records.filter(r=> r.direction==='out' && checkPeriodMatch(r.date, year, month) && !r.revalue);
}

/* ---------------- DATE FILTER SETUP ---------------- */
function initFilterControls(){
  const yearSel = document.getElementById('yearSelect');
  const monthSel = document.getElementById('monthSelect');
  
  const yearsSet = new Set();
  yearsSet.add(new Date().getFullYear());
  records.forEach(r => {
    if(r.date) {
      const y = parseInt(r.date.split('-')[0], 10);
      if(!isNaN(y)) yearsSet.add(y);
    }
  });
  const yearsList = Array.from(yearsSet).sort((a,b) => b - a);

  yearSel.innerHTML = yearsList.map(y => `<option value="${y}">${y}年</option>`).join('');
  yearSel.value = selectedYear;

  let mOptions = `<option value="0">全年汇总</option>`;
  for(let m=1; m<=12; m++){
    mOptions += `<option value="${m}">${m}月</option>`;
  }
  monthSel.innerHTML = mOptions;
  monthSel.value = selectedMonth;

  // Filter dropdown for records
  const recJarFilter = document.getElementById('recJarFilter');
  const currentVal = recJarFilter.value;
  recJarFilter.innerHTML = `<option value="all">全部罐子</option>` + jars.map(j=>`<option value="${j.id}">${j.icon} ${escapeHtml(j.name)}</option>`).join('');
  recJarFilter.value = currentVal;
}

function onDateFilterChange(){
  selectedYear = parseInt(document.getElementById('yearSelect').value, 10);
  selectedMonth = parseInt(document.getElementById('monthSelect').value, 10);
  renderSpendAnalysis();
  renderBudgets();
}

/* ---------------- RENDER ANALYSIS ---------------- */
function renderSpendAnalysis(){
  const outRecs = filterOutRecords(selectedYear, selectedMonth);
  
  const totalSpentGlobal = outRecs.reduce((s,r)=>{
    const jar = jars.find(j=>j.id===r.jarId);
    const curr = jar ? (jar.currency||'MYR') : 'MYR';
    return s + convertAmount(parseFloat(r.amount), curr, globalCurrency);
  }, 0);

  const budgetMultiplier = selectedMonth === 0 ? 12 : 1;
  const totalBudgetGlobal = jars.filter(j=>j.type==='budget').reduce((s,j)=>{
    const curr = j.currency || 'MYR';
    return s + convertAmount((j.plan||0) * budgetMultiplier, curr, globalCurrency);
  }, 0);

  const totalSpentBudgetGlobal = jars.filter(j=>j.type==='budget').reduce((s,j)=>{
    const curr = j.currency || 'MYR';
    return s + convertAmount(budgetSpent(j, selectedYear, selectedMonth), curr, globalCurrency);
  }, 0);

  const remainGlobal = totalBudgetGlobal - totalSpentBudgetGlobal;
  const periodLabel = selectedMonth === 0 ? `${selectedYear}全年` : `${selectedYear}年${selectedMonth}月`;

  const summaryWrap = document.getElementById('spendSummary');
  summaryWrap.innerHTML = `
    <div class="spend-stats">
      <div class="stat-card">
        <div class="stat-label">${periodLabel}总支出 (${globalCurrency})</div>
        <div class="stat-value red num">${fmt(totalSpentGlobal, globalCurrency)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">预算结余 (${globalCurrency})</div>
        <div class="stat-value ${remainGlobal<0?'red':'green'} num">${fmt(remainGlobal, globalCurrency)}</div>
      </div>
    </div>`;

  const byJar = {};
  outRecs.forEach(r=>{ 
    const jar = jars.find(j=>j.id===r.jarId);
    if(jar){
      const curr = jar.currency || 'MYR';
      const amtGlobal = convertAmount(parseFloat(r.amount), curr, globalCurrency);
      byJar[r.jarId] = (byJar[r.jarId]||0) + amtGlobal; 
    }
  });

  const rows = Object.entries(byJar)
    .map(([jarId, amt])=>({ jar: jars.find(j=>j.id===jarId), amt }))
    .filter(x=>x.jar)
    .sort((a,b)=>b.amt-a.amt);

  const bWrap = document.getElementById('spendBreakdown');
  if(rows.length===0){
    bWrap.innerHTML = `<div class="empty">${periodLabel} 暂无支出记录。</div>`;
  } else {
    const max = rows[0].amt;
    bWrap.innerHTML = `<div class="jar-card">` + rows.map(({jar,amt})=>{
      const pct = totalSpentGlobal ? (amt/totalSpentGlobal*100) : 0;
      const widthPct = max ? (amt/max*100) : 0;
      return `<div class="breakdown-row">
        <div class="breakdown-top">
          <span class="breakdown-name">${jar.icon} ${escapeHtml(jar.name)}</span>
          <span class="breakdown-amt">${fmt(amt, globalCurrency)} · ${pct.toFixed(0)}%</span>
        </div>
        <div class="breakdown-track"><div class="breakdown-fill" style="width:${widthPct}%;background:${jar.color}"></div></div>
      </div>`;
    }).join('') + `</div>`;
  }

  const card = document.getElementById('dailyChartCard');
  const chartTitle = document.getElementById('chartTitle');
  if(outRecs.length===0){ card.style.display='none'; return; }
  card.style.display='block';

  if (selectedMonth === 0) {
    chartTitle.textContent = `${selectedYear}年 逐月支出分布`;
    const perMonth = new Array(12).fill(0);
    outRecs.forEach(r => {
      const jar = jars.find(j=>j.id===r.jarId);
      const curr = jar ? (jar.currency||'MYR') : 'MYR';
      const amtGlobal = convertAmount(parseFloat(r.amount), curr, globalCurrency);
      const m = parseInt(r.date.split('-')[1], 10);
      if(m >= 1 && m <= 12) perMonth[m-1] += amtGlobal;
    });
    drawChart('dailyChart', perMonth, '月', new Date().getMonth() + 1);
  } else {
    chartTitle.textContent = `${selectedYear}年${selectedMonth}月 每日支出趋势`;
    const daysInMonth = new Date(selectedYear, selectedMonth, 0).getDate();
    const perDay = new Array(daysInMonth).fill(0);
    outRecs.forEach(r=>{
      const jar = jars.find(j=>j.id===r.jarId);
      const curr = jar ? (jar.currency||'MYR') : 'MYR';
      const amtGlobal = convertAmount(parseFloat(r.amount), curr, globalCurrency);
      const d = parseInt(r.date.split('-')[2], 10);
      if(d >= 1 && d <= daysInMonth) perDay[d-1] += amtGlobal;
    });
    const curY = new Date().getFullYear();
    const curM = new Date().getMonth() + 1;
    const highlightDay = (curY === selectedYear && curM === selectedMonth) ? new Date().getDate() : -1;
    drawChart('dailyChart', perDay, '日', highlightDay);
  }
}

/* ---------------- CANVAS CHART (FIXED DPR SCALING) ---------------- */
function drawChart(canvasId, dataArr, unitLabel, highlightIdx){
  const canvas = document.getElementById(canvasId);
  if(!canvas || !canvas.parentElement) return;
  
  const parentWidth = Math.max(canvas.parentElement.clientWidth - 32, 200);
  const dpr = window.devicePixelRatio || 1;
  const cssW = parentWidth, cssH = 110;
  
  canvas.width = cssW * dpr; 
  canvas.height = cssH * dpr;
  canvas.style.width = cssW+'px'; 
  canvas.style.height = cssH+'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); 
  ctx.clearRect(0,0,cssW,cssH);

  const max = Math.max(...dataArr, 1);
  const n = dataArr.length;
  const gap = 2;
  const barW = Math.max(2, (cssW - gap*(n-1))/n);
  const chartH = 80;

  dataArr.forEach((val, i)=>{
    const h = (val/max)*chartH;
    const x = i*(barW+gap);
    const boxH = Math.max(h, 1);
    const y = chartH - boxH;
    
    ctx.fillStyle = ((i+1) === highlightIdx) ? '#c3944a' : (val>0 ? '#c05a3e' : '#e7e0d1');
    ctx.beginPath();
    const r = Math.min(2, barW/2, boxH/2);
    if(ctx.roundRect){
      ctx.roundRect(x, y, barW, boxH, r);
    } else {
      ctx.rect(x, y, barW, boxH);
    }
    ctx.fill();
  });

  ctx.fillStyle = '#6b6a63';
  ctx.font = '10px sans-serif';
  ctx.fillText('1' + unitLabel, 0, chartH+16);
  ctx.textAlign = 'right';
  ctx.fillText(n + unitLabel, cssW, chartH+16);
  ctx.textAlign = 'left';
}

function bottleSvg(color, percent, jarId = ''){
  const safeColor = (color || '#3a6b53').replace(/[^a-zA-Z0-9#]/g, '');
  const uniqueId = 'clip-' + (jarId ? jarId : Math.random().toString(36).slice(2, 8));
  percent = Math.max(0, Math.min(100, percent));
  const fillH = 46 * (percent/100);
  const y = 54 - fillH;
  return `<svg viewBox="0 0 52 66" fill="none">
    <rect x="20" y="4" width="12" height="10" rx="3" fill="#d8d2c2"/>
    <path d="M14 16 Q14 12 20 12 H32 Q38 12 38 16 V54 Q38 62 26 62 Q14 62 14 54 Z" fill="#fff" stroke="#e7e0d1" stroke-width="1.5"/>
    <clipPath id="${uniqueId}"><path d="M15 17 Q15 13 20 13 H32 Q37 13 37 17 V54 Q37 61 26 61 Q15 61 15 54 Z"/></clipPath>
    <rect x="14" y="${y}" width="24" height="${fillH+2}" fill="${safeColor}" opacity="0.85" clip-path="url(#${uniqueId})"/>
  </svg>`;
}

/* ---------------- RENDER MAIN ---------------- */
function renderBudgets(){
  const budgets = jars.filter(j=>j.type==='budget');
  const bWrap = document.getElementById('budgetList');
  const periodText = selectedMonth === 0 ? `${selectedYear}年度` : `${selectedMonth}月`;
  document.getElementById('budgetSectionTitle').textContent = `${periodText}支出预算`;

  if(budgets.length===0){
    bWrap.innerHTML = `<div class="empty">还没有支出预算罐子。点击「＋ 新增预算」，设定花费上限。</div>`;
  } else {
    const budgetMultiplier = selectedMonth === 0 ? 12 : 1;
    bWrap.innerHTML = budgets.map(j=>{
      const spent = budgetSpent(j, selectedYear, selectedMonth);
      const planAmt = (j.plan || 0) * budgetMultiplier;
      const remain = planAmt - spent;
      const pct = planAmt ? Math.max(0,Math.min(100,(spent/planAmt)*100)) : 0;
      const over = remain < 0;
      const curr = j.currency || 'MYR';
      return `<div class="jar-card">
        <div class="jar-top">
          <div class="bottle">${bottleSvg(over? '#c05a3e' : j.color, pct, j.id)}</div>
          <div class="jar-info">
            <div class="jar-name">${j.icon} ${escapeHtml(j.name)} <span style="font-size:10px;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--ink-soft);font-weight:normal;">${curr}</span></div>
            <div class="jar-value num ${remain<0?'neg':''}">${fmt(remain, curr)} <span style="font-size:12px;font-weight:400;color:var(--ink-soft);">剩余</span></div>
            <div class="jar-plan">${periodText}已花 ${fmt(spent, curr)} / 预算 ${fmt(planAmt, curr)}</div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${over?'var(--red)':'var(--green)'}"></div></div>
            ${over? `<div class="tag-over">${periodText}超支</div>` : ''}
          </div>
          <button class="jar-menu-btn" onclick="toggleActions('${j.id}')">⋯</button>
        </div>
        <div class="jar-actions" id="act-${j.id}" style="display:none;">
          <button class="mini-btn record" onclick="openRecordModal('${j.id}')">记一笔</button>
          <button class="mini-btn" onclick="openJarModal('${j.id}')">编辑</button>
          <button class="mini-btn del" onclick="deleteJar('${j.id}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }
}

function renderRecords(){
  const rWrap = document.getElementById('recordList');
  const searchText = (document.getElementById('recSearchInput').value || '').toLowerCase().trim();
  const filterJarId = document.getElementById('recJarFilter').value || 'all';

  let filtered = [...records];

  if(filterJarId !== 'all') {
    filtered = filtered.filter(r => r.jarId === filterJarId);
  }

  if(searchText) {
    filtered = filtered.filter(r => {
      const jar = jars.find(j=>j.id===r.jarId);
      const jarName = jar ? jar.name.toLowerCase() : '';
      const note = (r.note || '').toLowerCase();
      return jarName.includes(searchText) || note.includes(searchText);
    });
  }

  const sorted = filtered.sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 100);

  if(sorted.length===0){
    rWrap.innerHTML = `<div class="empty">没有查找到符合条件的记录。</div>`;
  } else {
    rWrap.innerHTML = sorted.map(r=>{
      const jar = jars.find(j=>j.id===r.jarId);
      if(!jar) return '';
      const isIn = r.direction==='in';
      const curr = jar.currency || 'MYR';
      return `<div class="record-row">
        <div class="rec-dot" style="background:${isIn?'var(--green)':'var(--red)'}"></div>
        <div class="rec-mid">
          <div class="rec-jar">${jar.icon} ${escapeHtml(jar.name)}</div>
          ${r.note? `<div class="rec-note">${escapeHtml(r.note)}</div>`:''}
          <div class="rec-date">${r.date}${r.auto? ' · 自动分配':''}${r.revalue? ' · 重新估值':''}${r.rateSnapshot ? ' · 汇率快照锁定':''}</div>
        </div>
        <div class="rec-amt ${isIn?'in':'out'} num">${isIn?'+':'-'}${fmt(parseFloat(r.amount), curr)}</div>
        <div class="rec-actions">
          <button class="rec-btn" onclick="openRecordModal(null, '${r.id}')">✏️</button>
          <button class="rec-btn" onclick="deleteRecord('${r.id}')">✕</button>
        </div>
      </div>`;
    }).join('');
  }
}

function render(){
  document.getElementById('globalCurrencySelect').value = globalCurrency;
  saveJars(jars); saveRecords(records);

  const assets = jars.filter(j=>j.type==='asset');

  const totalGlobal = assets.reduce((s,j)=>{
    const bal = assetBalance(j);
    const curr = j.currency || 'MYR';
    return s + convertAmount(bal, curr, globalCurrency);
  }, 0);
  document.getElementById('totalValue').textContent = fmt(totalGlobal, globalCurrency);

  initFilterControls();
  renderSpendAnalysis();
  renderBudgets();

  // Asset List
  const aWrap = document.getElementById('assetList');
  if(assets.length===0){
    aWrap.innerHTML = `<div class="empty">还没有资产类罐子。点击右上角「＋ 新增项目」，添加你的第一个存钱罐吧。</div>`;
  } else {
    aWrap.innerHTML = assets.map(j=>{
      const bal = assetBalance(j);
      const pct = assetMonthProgress(j);
      const stats = assetInvestmentStats(j);
      const curr = j.currency || 'MYR';
      const freqTxt = {none:'不自动', monthly:'每月自动', weekly:'每周自动', yearly:'每年自动'}[j.frequency||'none'];
      return `<div class="jar-card">
        <div class="jar-top">
          <div class="bottle">${bottleSvg(j.color, pct, j.id)}</div>
          <div class="jar-info">
            <div class="jar-name">${j.icon} ${escapeHtml(j.name)} <span style="font-size:10px;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--ink-soft);font-weight:normal;">${curr}</span></div>
            <div class="jar-value num">${fmt(bal, curr)}</div>
            <div class="jar-plan">计划 ${fmt(j.plan||0, curr)}/月 · ${freqTxt}</div>
            ${stats.hasRevalue ? `<div class="jar-plan" style="margin-top:4px;">累计投入 ${fmt(stats.principal, curr)} · 增值 <span style="color:${stats.gain>=0?'var(--green)':'var(--red)'};font-weight:700;">${stats.gain>=0?'+':''}${fmt(stats.gain, curr)}（${stats.gain>=0?'+':''}${stats.gainPct.toFixed(1)}%）</span></div>` : ''}
          </div>
          <button class="jar-menu-btn" onclick="toggleActions('${j.id}')">⋯</button>
        </div>
        <div class="jar-actions" id="act-${j.id}" style="display:none;">
          <button class="mini-btn record" onclick="openRecordModal('${j.id}')">记一笔</button>
          <button class="mini-btn" onclick="openRevalueModal('${j.id}')">估值</button>
          <button class="mini-btn" onclick="openJarModal('${j.id}')">编辑</button>
          <button class="mini-btn del" onclick="deleteJar('${j.id}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }

  renderRecords();
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toggleActions(id){
  const el = document.getElementById('act-'+id);
  el.style.display = el.style.display==='none' ? 'flex' : 'none';
}

/* ---------------- JAR MODAL ---------------- */
function buildPickers(){
  document.getElementById('emojiGrid').innerHTML = EMOJIS.map(e=>
    `<button type="button" class="${e===jarModalIcon?'active':''}" onclick="pickEmoji('${e}')">${e}</button>`).join('');
  document.getElementById('colorRow').innerHTML = COLORS.map(c=>
    `<button type="button" class="swatch ${c===jarModalColor?'active':''}" style="background:${c}" onclick="pickColor('${c}')"></button>`).join('');
}
function pickEmoji(e){ jarModalIcon = e; buildPickers(); }
function pickColor(c){ jarModalColor = c; buildPickers(); }

function setJarType(t){
  jarModalType = t;
  document.getElementById('typeAssetBtn').classList.toggle('active', t==='asset');
  document.getElementById('typeBudgetBtn').classList.toggle('active', t==='budget');
  
  // 仅在新建时按规则切换；如果是编辑态，在 openJarModal 中始终隐藏
  if (!jarModalEditId) {
    document.getElementById('initialField').style.display = t==='asset' ? 'block' : 'none';
  }
  document.getElementById('freqField').style.display = t==='asset' ? 'block' : 'none';
  document.getElementById('planLabel').textContent = t==='asset' ? '每月计划存入' : '每月预算金额';
}

function openJarModal(id, forcedType){
  jarModalEditId = id;
  const jar = id ? jars.find(j=>j.id===id) : null;
  jarModalIcon = jar ? jar.icon : EMOJIS[0];
  jarModalColor = jar ? jar.color : COLORS[Math.floor(Math.random()*COLORS.length)];
  
  setJarType(jar ? jar.type : (forcedType||'asset'));
  document.getElementById('jarModalTitle').textContent = jar ? '编辑罐子' : '新增项目';

  // Bug 修复 2: 编辑已有罐子时隐藏“初始余额”框，消除重复计算风险
  const initialField = document.getElementById('initialField');
  if (jar) {
    initialField.style.display = 'none';
  } else {
    initialField.style.display = (forcedType || 'asset') === 'asset' ? 'block' : 'none';
  }

  document.getElementById('jarCurrency').value = jar ? (jar.currency||'MYR') : 'MYR';
  document.getElementById('jarName').value = jar ? jar.name : '';
  document.getElementById('jarInitial').value = jar ? (jar.initial||0) : '';
  document.getElementById('jarPlan').value = jar ? (jar.plan||0) : '';
  document.getElementById('jarFreq').value = jar ? (jar.frequency||'none') : 'none';
  buildPickers();
  document.getElementById('jarOverlay').classList.add('show');
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function saveJar(){
  const name = document.getElementById('jarName').value.trim();
  if(!name){ alert('请输入名称'); return; }
  
  const initial = parseFloat(document.getElementById('jarInitial').value)||0;
  const plan = parseFloat(document.getElementById('jarPlan').value)||0;
  if(initial < 0 || plan < 0){ alert('金额不能为负数'); return; }

  const currency = document.getElementById('jarCurrency').value || 'MYR';
  const freq = document.getElementById('jarFreq').value;

  if(jarModalEditId){
    const jar = jars.find(j=>j.id===jarModalEditId);
    jar.name = name; jar.icon = jarModalIcon; jar.color = jarModalColor;
    jar.type = jarModalType;
    jar.currency = currency; jar.plan = plan; jar.frequency = freq;
    // 编辑时不覆盖已有初始余额
  } else {
    // Bug 修复 4: 新建罐子时将 lastAuto 设定为今天，防止首次点击“自动分配”被误触发
    jars.push({
      id: 'j'+Date.now()+Math.random().toString(36).slice(2,6),
      name, icon: jarModalIcon, color: jarModalColor,
      type: jarModalType,
      currency: currency,
      initial: jarModalType==='asset' ? initial : 0,
      plan, frequency: freq,
      lastAuto: todayStr(),
      createdAt: todayStr()
    });
  }
  closeModal('jarOverlay');
  render();
}

function deleteJar(id){
  if(!confirm('确定删除这个罐子吗？相关记录也会一并删除且无法恢复。')) return;
  jars = jars.filter(j=>j.id!==id);
  records = records.filter(r=>r.jarId!==id);
  render();
}

/* ---------------- RECORD MODAL (CREATE & EDIT) ---------------- */
function openRecordModal(preselectJarId, editId = null){
  if(jars.length===0){
    alert('请先添加一个罐子');
    return;
  }
  editingRecordId = editId;
  const sel = document.getElementById('recJar');
  sel.innerHTML = jars.map(j=>`<option value="${j.id}">${j.icon} ${escapeHtml(j.name)}（${j.currency||'MYR'}）</option>`).join('');

  if(editId) {
    const rec = records.find(r=>r.id===editId);
    if(rec) {
      document.getElementById('recordModalTitle').textContent = '编辑记录';
      sel.value = rec.jarId;
      setDirection(rec.direction);
      document.getElementById('recAmount').value = rec.amount;
      document.getElementById('recDate').value = rec.date;
      document.getElementById('recNote').value = rec.note || '';
    }
  } else {
    document.getElementById('recordModalTitle').textContent = '记一笔';
    if(preselectJarId) sel.value = preselectJarId;
    onRecordJarChange();
    document.getElementById('recAmount').value = '';
    document.getElementById('recDate').value = todayStr();
    document.getElementById('recDate').max = todayStr();
    document.getElementById('recNote').value = '';
  }

  document.getElementById('recordOverlay').classList.add('show');
}

function onRecordJarChange(){
  if(editingRecordId) return;
  const jar = jars.find(j=>j.id===document.getElementById('recJar').value);
  setDirection(jar && jar.type==='budget' ? 'out' : 'in');
}

function setDirection(d){
  recDirection = d;
  document.getElementById('dirInBtn').classList.toggle('active', d==='in');
  document.getElementById('dirOutBtn').classList.toggle('active', d==='out');
}

function saveRecord(){
  const jarId = document.getElementById('recJar').value;
  const amount = parseFloat(document.getElementById('recAmount').value);
  if(isNaN(amount) || amount <= 0){ alert('请输入有效的大于0的金额'); return; }
  
  const date = document.getElementById('recDate').value || todayStr();
  const note = document.getElementById('recNote').value.trim();

  if(editingRecordId) {
    const rec = records.find(r=>r.id===editingRecordId);
    if(rec) {
      rec.jarId = jarId;
      rec.direction = recDirection;
      rec.amount = amount;
      rec.date = date;
      rec.note = note;
    }
  } else {
    records.push({ id:'r'+Date.now()+Math.random().toString(36).slice(2,6), jarId, direction:recDirection, amount, date, note, auto:false });
  }
  
  closeModal('recordOverlay');
  render();
}

function deleteRecord(id){
  if(!confirm('删除这条记录？')) return;
  records = records.filter(r=>r.id!==id);
  render();
}

/* ---------------- TRANSFER MODAL ---------------- */
function openTransferModal(){
  if(jars.length < 2){
    alert('需要至少 2 个罐子才能进行资金划转');
    return;
  }
  const options = jars.map(j=>`<option value="${j.id}">${j.icon} ${escapeHtml(j.name)} (${j.currency||'MYR'})</option>`).join('');
  document.getElementById('transFromJar').innerHTML = options;
  document.getElementById('transToJar').innerHTML = options;
  document.getElementById('transToJar').selectedIndex = 1;
  document.getElementById('transAmount').value = '';
  document.getElementById('transDate').value = todayStr();
  document.getElementById('transNote').value = '';
  document.getElementById('transferOverlay').classList.add('show');
}

function saveTransfer(){
  const fromId = document.getElementById('transFromJar').value;
  const toId = document.getElementById('transToJar').value;
  if(fromId === toId){ alert('转出和转入不能是同一个罐子'); return; }

  const amount = parseFloat(document.getElementById('transAmount').value);
  if(isNaN(amount) || amount <= 0){ alert('请输入有效的划转金额'); return; }

  const fromJar = jars.find(j=>j.id===fromId);
  const toJar = jars.find(j=>j.id===toId);
  const date = document.getElementById('transDate').value || todayStr();
  const note = document.getElementById('transNote').value.trim();

  const fromCurr = fromJar.currency || 'MYR';
  const toCurr = toJar.currency || 'MYR';
  
  // Bug 修复 3: 计算并锁定划转时刻的汇率快照 (rateSnapshot)
  const executedRate = convertAmount(1, fromCurr, toCurr);
  const convertedAmount = convertAmount(amount, fromCurr, toCurr);

  const transferTag = ` [划转]`;
  records.push({
    id:'r'+Date.now()+Math.random().toString(36).slice(2,6),
    jarId: fromId,
    direction: 'out',
    amount: amount,
    date,
    note: (note ? note : '资金划转') + ` -> ${toJar.name}` + transferTag,
    rateSnapshot: executedRate
  });

  records.push({
    id:'r'+(Date.now()+1)+Math.random().toString(36).slice(2,6),
    jarId: toId,
    direction: 'in',
    amount: convertedAmount,
    date,
    note: (note ? note : '资金划转') + ` <- ${fromJar.name}` + transferTag,
    rateSnapshot: executedRate
  });

  closeModal('transferOverlay');
  render();
}

/* ---------------- REVALUE ---------------- */
let revalueJarId = null;
function openRevalueModal(jarId){
  revalueJarId = jarId;
  const jar = jars.find(j=>j.id===jarId);
  const bal = assetBalance(jar);
  const curr = jar.currency || 'MYR';
  document.getElementById('revalueHint').textContent = `${jar.icon} ${jar.name} 当前记录余额为 ${fmt(bal, curr)}，输入最新市值后会自动记一笔涨跌差额，不影响你的每月存钱计划进度。`;
  document.getElementById('revalueAmount').value = bal.toFixed(2);
  document.getElementById('revalueNote').value = '';
  document.getElementById('revalueOverlay').classList.add('show');
}

function saveRevalue(){
  const jar = jars.find(j=>j.id===revalueJarId);
  const newVal = parseFloat(document.getElementById('revalueAmount').value);
  if(isNaN(newVal) || newVal < 0){ alert('请输入有效市值'); return; }
  const bal = assetBalance(jar);
  const diff = newVal - bal;
  if(Math.abs(diff) < 0.005){ closeModal('revalueOverlay'); return; }
  const note = document.getElementById('revalueNote').value.trim() || '重新估值';
  records.push({
    id:'r'+Date.now()+Math.random().toString(36).slice(2,6),
    jarId: jar.id,
    direction: diff>0 ? 'in' : 'out',
    amount: Math.abs(diff),
    date: todayStr(),
    note,
    auto:false,
    revalue:true
  });
  closeModal('revalueOverlay');
  render();
}

/* ---------------- AUTO PLANS (FIXED TIMEZONE BUG) ---------------- */
function dueForAuto(jar){
  if(!jar.plan || jar.frequency === 'none') return false;
  if(!jar.lastAuto) return true;
  
  const last = parseLocalDate(jar.lastAuto);
  const now = new Date();
  last.setHours(0,0,0,0);
  now.setHours(0,0,0,0);
  
  if (jar.frequency === 'weekly') {
    const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
    return diffDays >= 7;
  }
  if (jar.frequency === 'monthly') {
    return (now.getFullYear() > last.getFullYear()) || 
           (now.getFullYear() === last.getFullYear() && now.getMonth() > last.getMonth());
  }
  if (jar.frequency === 'yearly') {
    return now.getFullYear() > last.getFullYear();
  }
  return false;
}

function applyAutoPlans(){
  let count = 0;
  jars.filter(j=>j.type==='asset').forEach(j=>{
    if(dueForAuto(j)){
      records.push({ id:'r'+Date.now()+Math.random().toString(36).slice(2,6), jarId:j.id, direction:'in', amount:j.plan, date:todayStr(), note:'自动分配', auto:true });
      j.lastAuto = todayStr();
      count++;
    }
  });
  render();
  alert(count>0 ? `已自动分配 ${count} 个罐子的计划金额` : '目前没有到期需要自动分配的罐子');
}

/* ---------------- BACKUP & RESTORE ---------------- */
function exportBackup(){
  const data = JSON.stringify({jars, records, globalCurrency, rates: RATES_TO_MYR}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `钱罐数据备份_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.jars) || !Array.isArray(data.records)){
        throw new Error("格式无效：必须包含 jars 和 records 数组");
      }
      const isValidJars = data.jars.every(j => j && j.id && j.name && j.type);
      const isValidRecords = data.records.every(r => r && r.id && r.jarId && !isNaN(parseFloat(r.amount)) && r.direction && r.date);
      if(!isValidJars || !isValidRecords) throw new Error("数据格式不完整或包含损坏项");

      if(!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      jars = data.jars;
      records = data.records;
      
      // Bug 修复 1: 导入备份时，同步更新 localStorage 中的主货币配置
      if(data.globalCurrency) {
        globalCurrency = data.globalCurrency;
        localStorage.setItem('moneyjar_global_currency', globalCurrency);
      }
      
      if(data.rates) {
        RATES_TO_MYR = Object.assign({}, DEFAULT_RATES, data.rates);
        localStorage.setItem(RATES_KEY, JSON.stringify(RATES_TO_MYR));
      }
      render();
      alert('数据恢复成功！');
    }catch(err){ alert('文件解析失败：' + err.message); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* ---------------- PDF / PRINT EXPORT ---------------- */
function printReport(type){
  const periodLabel = selectedMonth === 0 ? `${selectedYear}全年` : `${selectedYear}年${selectedMonth}月`;
  const originalTitle = document.title;
  
  if (type === 'analysis') {
    document.title = `钱罐记账_${periodLabel}_财务报告`;
  } else {
    document.title = `钱罐记账_交易流水明细清单_${todayStr()}`;
  }
  
  window.print();
  document.title = originalTitle;
}
