<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>钱罐记账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c2436;
    --navy-2:#252f47;
    --cream:#f2ede2;
    --card:#faf7f0;
    --gold:#c3944a;
    --gold-2:#b0813a;
    --green:#3a6b53;
    --green-light:#e7efe9;
    --red:#c05a3e;
    --red-light:#f6e6e0;
    --ink:#20241f;
    --ink-soft:#6b6a63;
    --line:#e7e0d1;
    --shadow:0 2px 10px rgba(28,36,54,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--cream);
    font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .num{font-family:'DM Mono',ui-monospace,monospace;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--cream);padding-bottom:100px;}

  /* HERO */
  .hero{
    background:linear-gradient(160deg,var(--navy),var(--navy-2) 80%);
    color:#fff;
    padding:28px 20px 26px;
    border-radius:0 0 28px 28px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    background:radial-gradient(circle,rgba(195,148,74,0.25),transparent 70%);
  }
  .eyebrow{font-size:12px;letter-spacing:0.14em;opacity:0.6;text-transform:uppercase;margin-bottom:6px;}
  .hero h1{font-size:22px;margin:0 0 14px;font-weight:700;}
  .total-label{font-size:13px;opacity:0.65;margin-bottom:4px;}
  .total-value{font-size:40px;font-weight:500;letter-spacing:-0.5px;}
  .total-note{font-size:12px;opacity:0.55;margin-top:8px;line-height:1.5;}
  .hero-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;border:none;border-radius:14px;padding:13px 10px;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-gold{background:linear-gradient(180deg,#d3a35a,var(--gold-2));color:#2a1c08;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.18);}

  /* SECTIONS */
  .section{padding:22px 18px 4px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .section-title{font-size:19px;font-weight:700;}
  .empty{
    text-align:center;padding:34px 18px;color:var(--ink-soft);font-size:13.5px;
    background:var(--card);border:1.5px dashed var(--line);border-radius:18px;line-height:1.7;
  }

  /* JAR CARD */
  .jar-card{
    background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;
    box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03);
  }
  .jar-top{display:flex;align-items:center;gap:14px;}
  .bottle{
    width:52px;height:66px;flex-shrink:0;position:relative;
  }
  .bottle svg{width:100%;height:100%;display:block;}
  .jar-info{flex:1;min-width:0;}
  .jar-name{font-size:15px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:6px;}
  .jar-value{font-size:24px;font-weight:500;letter-spacing:-0.3px;}
  .jar-value.neg{color:var(--red);}
  .jar-detail{margin-top:12px;font-size:12.5px;color:var(--ink-soft);}
  .progress-track{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;border-radius:5px;transition:width .3s ease;}
  .tag-over{
    display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--red);
    background:var(--red-light);padding:3px 10px;border-radius:20px;
  }
  .jar-actions{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
  .mini-btn{
    flex:1;font-size:12.5px;font-weight:700;padding:8px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .mini-btn.record{color:var(--green);border-color:#cfe2d7;}
  .mini-btn.del{color:var(--red);border-color:#eccec4;}

  /* RECORDS */
  .record-row{
    display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;
    padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);
  }
  .rec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .rec-mid{flex:1;min-width:0;}
  .rec-jar{font-size:14px;font-weight:700;}
  .rec-note{font-size:11.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rec-right{text-align:right;}
  .rec-amt{font-size:15px;font-weight:700;}
  .rec-amt.sub{color:var(--red);}
  .rec-amt.add{color:var(--green);}
  .rec-time{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .rec-del{background:none;border:none;color:#b2ada3;font-size:15px;cursor:pointer;padding:4px;margin-left:4px;}

  /* MODALS */
  .modal-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(18,22,31,0.55);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .modal-mask.active{opacity:1;pointer-events:auto;}
  .modal{
    background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;
    padding:22px 20px 32px;transform:translateY(100%);transition:transform .25s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  .modal-mask.active .modal{transform:translateY(0);}
  .modal-title{font-size:18px;font-weight:700;margin-bottom:16px;}
  .form-group{margin-bottom:14px;}
  .form-label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .form-input,.form-select,.form-textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:15px;font-family:inherit;background:#fff;outline:none;
  }
  .form-textarea{height:90px;resize:none;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--navy);}
  .form-row{display:flex;gap:10px;}
  .form-row > *{flex:1;}
  .tab-group{display:flex;background:var(--cream);padding:3px;border-radius:12px;margin-bottom:14px;}
  .tab-btn{
    flex:1;border:none;background:transparent;padding:10px;font-size:13.5px;font-weight:700;
    border-radius:9px;cursor:pointer;color:var(--ink-soft);
  }
  .tab-btn.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.08);}
  .color-picker{display:flex;gap:10px;margin-top:6px;}
  .color-opt{
    width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  }
  .color-opt.active{border-color:var(--navy);transform:scale(1.1);}
  
  .backup-box{
    margin-top:20px;padding:14px;background:var(--card);border-radius:14px;border:1px solid var(--line);
    display:flex;gap:10px;
  }
</style>
</head>
<body>

<div class="app">
  <!-- HERO HEADER -->
  <div class="hero">
    <div class="eyebrow">MONEY JAR MANAGER</div>
    <h1>钱罐记账</h1>
    <div class="total-label">可自由支配总额</div>
    <div class="total-value num" id="totalBalance">¥ 0.00</div>
    <div class="total-note" id="totalNote">加载中...</div>
    <div class="hero-actions">
      <button class="btn btn-gold" onclick="openAddModal()">+ 新建钱罐</button>
      <button class="btn btn-ghost" onclick="openRecordModal()">记一笔</button>
    </div>
  </div>

  <!-- JARS SECTION -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">我的钱罐</div>
    </div>
    <div id="jarList"></div>
  </div>

  <!-- RECENT RECORDS -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">近期明细</div>
    </div>
    <div id="recordList"></div>
  </div>

  <!-- BACKUP & RESTORE -->
  <div class="section" style="margin-top:20px;">
    <div class="backup-box">
      <button class="mini-btn" onclick="exportData()">导出数据备份</button>
      <button class="mini-btn" onclick="openImportModal()">导入恢复数据</button>
    </div>
  </div>
</div>

<!-- MODAL: ADD / EDIT JAR -->
<div class="modal-mask" id="jarModal">
  <div class="modal">
    <div class="modal-title" id="jarModalTitle">新建钱罐</div>
    <div class="form-group">
      <label class="form-label">钱罐名称</label>
      <input type="text" class="form-input" id="jarName" placeholder="例如：生活费、旅游基金">
    </div>
    <div class="form-group">
      <label class="form-label">类型</label>
      <select class="form-select" id="jarType" onchange="toggleTypeFields()">
        <option value="budget">预算额度型（如每月生活费，从上限扣减）</option>
        <option value="target">储蓄目标型（如积攒旅行费，从0开始增加）</option>
        <option value="flexible">自由存取型（普通钱包，可存可取）</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" id="amountLabel">初始金额/总预算</label>
        <input type="number" step="0.01" class="form-input num" id="jarAmount" placeholder="0.00">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">主题颜色</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" style="color:var(--ink);border-color:var(--line)" onclick="closeModal('jarModal')">取消</button>
      <button class="btn btn-gold" onclick="saveJar()">保存</button>
    </div>
  </div>
</div>

<!-- MODAL: ADD RECORD -->
<div class="modal-mask" id="recordModal">
  <div class="modal">
    <div class="modal-title">记一笔</div>
    <div class="tab-group">
      <button class="tab-btn active" id="tabSub" onclick="setRecType('sub')">支出 / 扣减 (-)</button>
      <button class="tab-btn" id="tabAdd" onclick="setRecType('add')">存入 / 增加 (+)</button>
    </div>
    <div class="form-group">
      <label class="form-label">选择钱罐</label>
      <select class="form-select" id="recJarSelect"></select>
    </div>
    <div class="form-group">
      <label class="form-label">金额</label>
      <input type="number" step="0.01" class="form-input num" id="recAmount" placeholder="0.00">
    </div>
    <div class="form-group">
      <label class="form-label">备注说明（可选）</label>
      <input type="text" class="form-input" id="recNote" placeholder="例如：午餐、买衣服">
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" style="color:var(--ink);border-color:var(--line)" onclick="closeModal('recordModal')">取消</button>
      <button class="btn btn-gold" onclick="saveRecord()">确定记入</button>
    </div>
  </div>
</div>

<!-- MODAL: IMPORT DATA -->
<div class="modal-mask" id="importModal">
  <div class="modal">
    <div class="modal-title">导入数据</div>
    <div class="form-group">
      <label class="form-label">粘贴备份的数据字符串：</label>
      <textarea class="form-textarea" id="importText" placeholder="将备份的文本粘贴到这里"></textarea>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" style="color:var(--ink);border-color:var(--line)" onclick="closeModal('importModal')">取消</button>
      <button class="btn btn-gold" onclick="importData()">确认导入</button>
    </div>
  </div>
</div>

<script>
  const COLORS = ['#3a6b53', '#c05a3e', '#c3944a', '#252f47', '#7b5294'];
  let selectedColor = COLORS[0];
  let recType = 'sub';
  let editingJarId = null;

  let state = {
    jars: JSON.parse(localStorage.getItem('mj_jars')) || [],
    records: JSON.parse(localStorage.getItem('mj_records')) || []
  };

  function saveData() {
    localStorage.setItem('mj_jars', JSON.stringify(state.jars));
    localStorage.setItem('mj_records', JSON.stringify(state.records));
    render();
  }

  function initColors() {
    const el = document.getElementById('colorPicker');
    el.innerHTML = COLORS.map(c => `
      <div class="color-opt ${c === selectedColor ? 'active' : ''}" 
           style="background:${c}" 
           onclick="selectColor('${c}')"></div>
    `).join('');
  }

  function selectColor(c) {
    selectedColor = c;
    initColors();
  }

  function toggleTypeFields() {
    const type = document.getElementById('jarType').value;
    const label = document.getElementById('amountLabel');
    if (type === 'budget') label.innerText = '本期总预算金额';
    else if (type === 'target') label.innerText = '目标储备总额';
    else label.innerText = '初始可用余额';
  }

  function renderJars() {
    const container = document.getElementById('jarList');
    if (state.jars.length === 0) {
      container.innerHTML = `<div class="empty">还没有钱罐，点击上方“+ 新建钱罐”开始规划资金吧！</div>`;
      return;
    }

    container.innerHTML = state.jars.map(jar => {
      let detailHtml = '';
      let isNeg = jar.balance < 0;

      if (jar.type === 'budget') {
        let pct = Math.max(0, Math.min(100, (jar.balance / jar.initial) * 100));
        detailHtml = `
          <div class="jar-detail">
            <div style="display:flex;justify-content:space-between">
              <span>预算剩余 ${pct.toFixed(0)}%</span>
              <span class="num">总额: ¥${jar.initial.toFixed(2)}</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%;background:${jar.color}"></div>
            </div>
            ${jar.balance < 0 ? `<div class="tag-over">⚠️ 已超支 ¥${Math.abs(jar.balance).toFixed(2)}</div>` : ''}
          </div>`;
      } else if (jar.type === 'target') {
        let pct = Math.max(0, Math.min(100, (jar.balance / jar.initial) * 100));
        detailHtml = `
          <div class="jar-detail">
            <div style="display:flex;justify-content:space-between">
              <span>目标进度 ${pct.toFixed(0)}%</span>
              <span class="num">目标: ¥${jar.initial.toFixed(2)}</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%;background:${jar.color}"></div>
            </div>
          </div>`;
      }

      return `
        <div class="jar-card">
          <div class="jar-top">
            <div class="bottle">
              <svg viewBox="0 0 52 66" fill="none">
                <path d="M16 8C16 4 20 2 26 2C32 2 36 4 36 8V12H16V8Z" fill="${jar.color}" opacity="0.3"/>
                <rect x="12" y="12" width="28" height="6" rx="3" fill="${jar.color}"/>
                <path d="M10 20C10 18 12 17 14 17H38C40 17 42 18 42 20V56C42 61 38 64 33 64H19C14 64 10 61 10 56V20Z" fill="${jar.color}" opacity="0.15" stroke="${jar.color}" stroke-width="2.5"/>
              </svg>
            </div>
            <div class="jar-info">
              <div class="jar-name">${jar.name}</div>
              <div class="jar-value num ${isNeg ? 'neg' : ''}">¥ ${jar.balance.toFixed(2)}</div>
            </div>
          </div>
          ${detailHtml}
          <div class="jar-actions">
            <button class="mini-btn record" onclick="openRecordModal('${jar.id}')">记一笔</button>
            <button class="mini-btn del" onclick="deleteJar('${jar.id}')">删除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderRecords() {
    const container = document.getElementById('recordList');
    if (state.records.length === 0) {
      container.innerHTML = `<div class="empty">暂无明细记录</div>`;
      return;
    }

    container.innerHTML = state.records.map(rec => {
      const jar = state.jars.find(j => j.id === rec.jarId) || { name: '已删除钱罐', color: '#999' };
      const isAdd = rec.type === 'add';
      return `
        <div class="record-row">
          <div class="rec-dot" style="background:${jar.color}"></div>
          <div class="rec-mid">
            <div class="rec-jar">${jar.name}</div>
            <div class="rec-note">${rec.note || '无备注'}</div>
          </div>
          <div class="rec-right">
            <div class="rec-amt num ${isAdd ? 'add' : 'sub'}">${isAdd ? '+' : '-'}${rec.amount.toFixed(2)}</div>
            <div class="rec-time">${rec.time}</div>
          </div>
          <button class="rec-del" onclick="deleteRecord('${rec.id}')">✕</button>
        </div>
      `;
    }).join('');
  }

  function renderSummary() {
    const total = state.jars.reduce((acc, j) => acc + j.balance, 0);
    document.getElementById('totalBalance').innerText = `¥ ${total.toFixed(2)}`;
    document.getElementById('totalNote').innerText = `共 ${state.jars.length} 个钱罐正在统筹管理中`;
  }

  function render() {
    renderJars();
    renderRecords();
    renderSummary();
  }

  /* MODAL CONTROL */
  function openAddModal() {
    editingJarId = null;
    document.getElementById('jarModalTitle').innerText = '新建钱罐';
    document.getElementById('jarName').value = '';
    document.getElementById('jarAmount').value = '';
    selectedColor = COLORS[0];
    initColors();
    toggleTypeFields();
    document.getElementById('jarModal').classList.add('active');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  function saveJar() {
    const name = document.getElementById('jarName').value.trim();
    const type = document.getElementById('jarType').value;
    const amount = parseFloat(document.getElementById('jarAmount').value) || 0;

    if (!name) return alert('请输入钱罐名称');

    state.jars.push({
      id: Date.now().toString(),
      name,
      type,
      initial: amount,
      balance: amount,
      color: selectedColor
    });

    saveData();
    closeModal('jarModal');
  }

  function deleteJar(id) {
    if (!confirm('确定要删除这个钱罐吗？对应历史明细将保留')) return;
    state.jars = state.jars.filter(j => j.id !== id);
    saveData();
  }

  function openRecordModal(defaultJarId) {
    if (state.jars.length === 0) return alert('请先创建至少一个钱罐');
    
    const select = document.getElementById('recJarSelect');
    select.innerHTML = state.jars.map(j => `<option value="${j.id}">${j.name}</option>`).join('');
    if (defaultJarId) select.value = defaultJarId;

    document.getElementById('recAmount').value = '';
    document.getElementById('recNote').value = '';
    setRecType('sub');
    document.getElementById('recordModal').classList.add('active');
  }

  function setRecType(type) {
    recType = type;
    document.getElementById('tabSub').className = `tab-btn ${type === 'sub' ? 'active' : ''}`;
    document.getElementById('tabAdd').className = `tab-btn ${type === 'add' ? 'active' : ''}`;
  }

  function saveRecord() {
    const jarId = document.getElementById('recJarSelect').value;
    const amount = parseFloat(document.getElementById('recAmount').value);
    const note = document.getElementById('recNote').value.trim();

    if (!amount || amount <= 0) return alert('请输入有效的金额');

    const jar = state.jars.find(j => j.id === jarId);
    if (!jar) return;

    if (recType === 'sub') {
      jar.balance -= amount;
    } else {
      jar.balance += amount;
    }

    const now = new Date();
    const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

    state.records.unshift({
      id: Date.now().toString(),
      jarId,
      type: recType,
      amount,
      note,
      time: timeStr
    });

    saveData();
    closeModal('recordModal');
  }

  function deleteRecord(id) {
    if (!confirm('确定要删除这条明细吗？')) return;
    state.records = state.records.filter(r => r.id !== id);
    saveData();
  }

  /* BACKUP & IMPORT */
  function exportData() {
    const backupStr = JSON.stringify(state);
    navigator.clipboard.writeText(backupStr).then(() => {
      alert('所有数据已成功复制到剪贴板！你可以粘贴保存到手机备忘录中。');
    }).catch(() => {
      prompt('请复制以下数据并保存：', backupStr);
    });
  }

  function openImportModal() {
    document.getElementById('importText').value = '';
    document.getElementById('importModal').classList.add('active');
  }

  function importData() {
    const raw = document.getElementById('importText').value.trim();
    if (!raw) return alert('请粘贴数据');
    try {
      const data = JSON.parse(raw);
      if (data.jars && data.records) {
        state = data;
        saveData();
        closeModal('importModal');
        alert('数据恢复成功！');
      } else {
        alert('数据格式不正确！');
      }
    } catch (e) {
      alert('解析失败，请输入有效的代码数据！');
    }
  }

  // INIT
  initColors();
  render();
</script>

</body>
</html>
